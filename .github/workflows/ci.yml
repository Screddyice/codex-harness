# GitHub fallback for Crow. Crow (.woodpecker.yaml) is the primary check for
# codex-harness; these jobs run the same checks with the same images when Crow never
# saw the push. See the CI section of README.md.
name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter, so stacked PRs (base = another feature branch) are
  # checked too. ready_for_review is listed so marking a draft ready starts the
  # full run; the default types do not include it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Crow CI on Shawn's Mac is the primary check. Crow posts a ci/crow/... status
  # within seconds of receiving a push, so this job waits up to 3 minutes for one.
  # If it appears, the jobs below are skipped and Crow's result is the merge check.
  # If not (Mac asleep or offline, so the webhook was lost), the jobs below run as
  # the standard GitHub CI. A manual run (workflow_dispatch) always runs them.
  crow-gate:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "Manual run: running GitHub CI."; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          for _ in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses" \
              --jq '[.[] | select(.context | startswith("ci/crow/"))] | length' || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              echo "Crow picked up $SHA; skipping GitHub CI (Crow's status is the check)."
              echo run=false >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 15
          done
          echo "No Crow status on $SHA after 3 minutes (Mac asleep or offline); running GitHub CI."
          echo run=true >> "$GITHUB_OUTPUT"

  # Same image and version as the shellcheck step in .woodpecker.yaml.
  shellcheck:
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck (koalaman/shellcheck-alpine:v0.11.0)
        run: |
          docker run --rm -i -v "$PWD:/src" -w /src koalaman/shellcheck-alpine:v0.11.0 sh -eu <<'SH'
          files=$(find . -type f -not -path './.git/*' | sort | while read -r f; do
            case "$f" in *.sh) echo "$f"; continue ;; esac
            head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)' && echo "$f"
          done)
          echo "$files"
          shellcheck -S warning $files
          SH

  # Same image, tools and macOS-only exclusions as the tests step in .woodpecker.yaml.
  tests:
    needs: crow-gate
    if: needs.crow-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    container: python:3.13-bookworm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update -qq && apt-get install -y -qq jq ripgrep >/dev/null
      - run: pip install -q --root-user-action=ignore pytest
      - run: git config --global --add safe.directory '*'
      - run: git config --global user.email ci@example.invalid
      - run: git config --global user.name crow-ci
      - run: git config --global init.defaultBranch main
      - run: find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - run: bash scripts/verify.sh
      - run: bash scripts/audit-client-boundary.sh
      - run: |
          fail=0
          for t in scripts/test-*; do
            case "$t" in
              # macOS-only: zprint/vm_stat/launchctl, and launchctl-derived values.
              scripts/test-kernel-zone-watchdog.sh|scripts/test-set-gui-env.sh)
                echo "SKIP $t (macOS-only)"; continue ;;
            esac
            case "$t" in *.py) runner=python3 ;; *) runner=bash ;; esac
            echo "=== $t"
            if ! "$runner" "$t"; then echo "FAILED $t"; fail=1; fi
          done
          exit "$fail"

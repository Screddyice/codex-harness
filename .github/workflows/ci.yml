name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          docker run --rm --entrypoint /bin/sh -v "$PWD:/workspace:ro" -w /workspace koalaman/shellcheck-alpine:v0.11.0 -es <<'SHELLCHECK_SCRIPT'
          files=$(find . -type f -not -path './.git/*' | sort | while read -r f; do
            case "$f" in *.sh) echo "$f"; continue ;; esac
            head -n1 "$f" | grep -qE '^#!.*[/ ](ba|da)?sh( |$)' && echo "$f"
          done)
          echo "$files"
          shellcheck -S warning $files
          SHELLCHECK_SCRIPT
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: python:3.13-bookworm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run checks
        run: |
          apt-get update -qq && apt-get install -y -qq jq ripgrep >/dev/null
          pip install -q --root-user-action=ignore pytest
          git config --global --add safe.directory '*'
          git config --global user.email ci@example.invalid
          git config --global user.name github-actions
          git config --global init.defaultBranch main
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash scripts/verify.sh
          bash scripts/audit-client-boundary.sh
          fail=0
          for t in scripts/test-*; do
            case "$t" in
              # macOS-only: zprint/vm_stat/launchctl, and launchctl-derived values.
              scripts/test-kernel-zone-watchdog.sh|scripts/test-set-gui-env.sh)
                echo "SKIP $t (macOS-only)"; continue ;;
            esac
            case "$t" in *.py) runner=python3 ;; *) runner=bash ;; esac
            echo "=== $t"
            if ! "$runner" "$t"; then echo "FAILED $t"; fail=1; fi
          done
          exit "$fail"
